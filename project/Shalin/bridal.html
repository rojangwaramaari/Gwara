<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Bridal Makeup — Shalin Studio</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="grain"></div>


<!-- NAV -->

<header class="nav">

  <div class="nav-inner">

    <a href="index.html" class="nav-brand">
      Shalin<span>Studio</span>
    </a>

    <nav class="nav-links">

      <a href="index.html#about">About</a>

      <a href="index.html#services">Services</a>

      <a href="index.html#work">Work</a>

      <a href="index.html#instagram">Instagram</a>

      <a
        href="index.html#contact"
        class="nav-cta"
      >
        Book a date
      </a>

    </nav>

  </div>

</header>


<!-- BRIDAL PAGE -->

<section class="work bridal-page">

  <div class="work-head">

    <div>

      <p class="eyebrow">
        Portfolio
      </p>

      <h1 class="section-title">
        Bridal Makeup
      </h1>

    </div>

    <p class="work-note">
      Bridal makeup by Shalin Studio.
      Click any photo to view.
    </p>

  </div>


  <div class="work-card">

    <img
        src="images/work/Subina/1.jpg"
        alt="Bridal Makeup 1"
        class="gallery-image"
    >

</div>

<div class="work-card">

    <img
        src="images/work/Subina/2.jpg"
        alt="Bridal Makeup 2"
        class="gallery-image"
    >

</div>
<div class="work-card">

    <img
        src="images/work/Subina/3.jpg"
        alt="Bridal Makeup 2"
        class="gallery-image"
    >

</div>

    


  </div>

</section>


<!-- LIGHTBOX -->

<div
  class="lightbox"
  id="lightbox"
  aria-hidden="true"
>

  <button
    class="lightbox-close"
    id="lightboxClose"
    type="button"
  >
    &times;
  </button>


  <button
    class="lightbox-prev"
    id="lightboxPrev"
    type="button"
  >
    &#10094;
  </button>


  <div class="lightbox-content">

    <img
      id="lightboxImg"
      src=""
      alt=""
    >

    <div id="lightboxCounter"></div>

  </div>


  <button
    class="lightbox-next"
    id="lightboxNext"
    type="button"
  >
    &#10095;
  </button>

</div>


<script src="script.js"></script>

</body>

</html>
