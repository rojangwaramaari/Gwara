<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gwaramaari</title>
<meta name="description" content="gwaramaari — a personal jukebox, no ads, no fuss.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#151009;
    --panel:rgba(24,18,12,0.66);
    --panel-solid:#1b140d;
    --wood:#2a1c10;
    --amber:#e8a33d;
    --rust:#c1502e;
    --brass:#9c8a5e;
    --cream:#f5ede0;
    --muted:#a89a86;
    --ring-track:rgba(245,237,224,0.12);
    --radius-lg:22px;
    --radius-md:14px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Space Grotesk', sans-serif;
    color:var(--cream);
    background-color:var(--bg-base);
    background-image:
      linear-gradient(180deg, rgba(10,7,4,0.55) 0%, rgba(10,7,4,0.72) 55%, rgba(10,7,4,0.9) 100%),
      url("/project/556_catalog_z/kumadai.png");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:64px 20px 40px;
    position:relative;
    overflow-x:hidden;
  }

  /* fallback wood-grain look if the background photo fails to load */
  body.bg-fallback{
    background-image:
      linear-gradient(180deg, rgba(10,7,4,0.35) 0%, rgba(10,7,4,0.75) 100%),
      radial-gradient(ellipse at 30% 20%, #3a2718 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, #241608 0%, transparent 60%),
      linear-gradient(160deg, #241a10 0%, #140d07 100%);
  }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(28px, 5vw, 40px);
    letter-spacing:0.5px;
    color:var(--amber);
    text-shadow:0 2px 18px rgba(0,0,0,0.6);
    margin:0 0 6px;
  }
  .tagline{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 40px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(245,237,224,0.08);
    border-radius:var(--radius-lg);
    padding:32px 28px 26px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* --- disc / cover art, the signature element --- */
  .disc-wrap{
    width:190px;
    height:190px;
    margin:0 auto 26px;
    border-radius:50%;
    padding:5px;
    background:conic-gradient(var(--amber) calc(var(--progress, 0) * 1%), var(--ring-track) 0);
    transition:background 0.15s linear;
  }
  .disc{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:#0e0a06 center/cover no-repeat;
    box-shadow:0 10px 26px rgba(0,0,0,0.55), inset 0 0 0 6px rgba(0,0,0,0.35), inset 0 0 0 8px rgba(245,237,224,0.06);
    position:relative;
  }
  .disc img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    animation:spin 16s linear infinite;
    animation-play-state:paused;
  }
  .disc.spinning img{ animation-play-state:running; }
  .disc::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:16px; height:16px;
    background:var(--wood);
    border:2px solid var(--brass);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .track-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    text-align:center;
    line-height:1.3;
    margin:0 0 4px;
    color:var(--cream);
  }
  .track-artist{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin:0 0 22px;
  }

  .seek-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .time{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    width:36px;
    flex-shrink:0;
  }
  .time.end{ text-align:right; }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:4px;
    border-radius:4px;
    background:var(--ring-track);
    outline:none;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px;height:13px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 3px rgba(232,163,61,0.2);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;border:none;
    background:var(--amber);
    cursor:pointer;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-bottom:20px;
  }
  .ctrl-btn{
    background:none;
    border:none;
    color:var(--cream);
    cursor:pointer;
    padding:6px;
    opacity:0.85;
    transition:opacity 0.15s, transform 0.15s;
  }
  .ctrl-btn:hover{ opacity:1; transform:translateY(-1px); }
  .ctrl-btn svg{ display:block; }
  .play-btn{
    width:56px; height:56px;
    border-radius:50%;
    background:linear-gradient(160deg, var(--amber), var(--rust));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px -4px rgba(193,80,46,0.5);
  }
  .play-btn svg{ fill:#1b140d; }

  .lower-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .vol-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
  }
  .vol-row input[type="range"]{ max-width:100px; }
  .icon-muted{ opacity:0.6; }
  .loop-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    border:1px solid rgba(245,237,224,0.18);
    background:transparent;
    color:var(--muted);
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    transition:all 0.15s;
  }
  .loop-btn.active{
    color:#1b140d;
    background:var(--amber);
    border-color:var(--amber);
  }

  .status-line{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:1px;
    color:var(--muted);
    margin-top:16px;
    min-height:14px;
  }

  /* --- new playlist section --- */
  .playlist-card{
    width:100%;
    max-width:420px;
    margin-top:22px;
  }
  .section-toggle{
    width:100%;
    background:var(--panel);
    border:1px solid rgba(245,237,224,0.08);
    border-radius:var(--radius-md);
    color:var(--cream);
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    letter-spacing:0.3px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
  }
  .section-toggle .chev{
    transition:transform 0.2s;
    opacity:0.7;
  }
  .section-toggle.open .chev{ transform:rotate(180deg); }

  .playlist-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.25s ease;
  }
  .playlist-body.open{ max-height:280px; }
  .playlist-inner{
    background:var(--panel);
    border:1px solid rgba(245,237,224,0.08);
    border-top:none;
    border-radius:0 0 var(--radius-md) var(--radius-md);
    padding:16px 18px 18px;
  }
  .playlist-inner p{
    font-size:12px;
    color:var(--muted);
    margin:0 0 10px;
    line-height:1.5;
  }
  .playlist-inner input[type="text"]{
    width:100%;
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(245,237,224,0.15);
    border-radius:10px;
    padding:11px 12px;
    color:var(--cream);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    margin-bottom:10px;
  }
  .playlist-inner input[type="text"]::placeholder{ color:rgba(168,154,134,0.6); }
  .playlist-actions{
    display:flex;
    gap:8px;
  }
  .btn-solid, .btn-ghost{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:500;
    border-radius:10px;
    padding:9px 14px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .btn-solid{ background:var(--amber); color:#1b140d; }
  .btn-ghost{ background:transparent; color:var(--muted); border-color:rgba(245,237,224,0.18); }
  .playlist-current{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
    margin-top:10px;
    word-break:break-all;
  }

  /* --- instagram banner --- */
  .ig-banner{
    position:fixed;
    bottom:20px;
    left:10%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:9px;
    background:var(--panel-solid);
    border:1px solid rgba(245,237,224,0.14);
    border-radius:30px;
    padding:9px 16px 9px 10px;
    text-decoration:none;
    color:var(--cream);
    font-size:12px;
    font-weight:500;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    z-index:20;
  }
  .ig-banner svg{ flex-shrink:0; }
  .ig-banner span.handle{ color:var(--amber); }

  @media (max-width:480px){
    body{ padding-top:48px; }
    .ig-banner{ bottom:12px; font-size:11px; }
  }

  #yt-player-slot{
    position:fixed;
    left:-9999px;
    top:-9999px;
    width:2px;
    height:2px;
  }
</style>
</head>
<body>

  <h1 class="wordmark">Gwaramaari x Sushant KC</h1>
  <p class="tagline">no ads · no video · just the mix</p>

  <div class="card">
    <div class="disc-wrap" id="discWrap" style="--progress:0;">
      <div class="disc" id="disc">
        <img id="coverArt" src="" alt="" onerror="this.style.opacity=0;">
      </div>
    </div>

    <p class="track-title" id="trackTitle">loading the mix…</p>
    <p class="track-artist" id="trackArtist">gwaramaari</p>

    <div class="seek-row">
      <span class="time" id="timeCurrent">0:00</span>
      <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
      <span class="time end" id="timeDuration">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 10 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" style="display:none;"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4.5 6 14 12l-9.5 6z"/></svg>
      </button>
    </div>

    <div class="lower-row">
      <div class="vol-row">
        <svg class="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/></svg>
        <input type="range" id="volBar" min="0" max="100" value="70">
      </div>
      <button class="loop-btn" id="loopBtn" title="Loop the mix">loop</button>
    </div>

    <p class="status-line" id="statusLine">connecting…</p>
  </div>

  <a class="ig-banner" href="https://www.instagram.com/gwaramaari" target="_blank" rel="noopener noreferrer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg>
    follow on Instagram <span class="handle">@gwaramaari</span>
  </a>

  <div id="yt-player-slot"></div>

  <script>
    // ---- config ----
    var DEFAULT_PLAYLIST_ID = "PL5Hz3Wnvr8GArQCOKfUZGYJh1Q3TOz-Am"; // fixed default playlist
    // fall back to a plain wood-tone background if the drive photo won't load
    (function(){
      var testImg = new Image();
      testImg.onerror = function(){ document.body.classList.add('bg-fallback'); };
      testImg.src = "https://lh3.googleusercontent.com/d/1yd7Hw6nS1uW2edPwmMOEkb2zCwfmc8sy";
    })();

    // ---- YouTube IFrame API ----
    var player, pollTimer;
    var currentPlaylistId = DEFAULT_PLAYLIST_ID;

    window.onYouTubeIframeAPIReady = function(){
      player = new YT.Player('yt-player-slot', {
        height: '2', width: '2',
        playerVars: {
          listType: 'playlist',
          list: currentPlaylistId,
          autoplay: 0,
          controls: 0,
          disablekb: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    };

    function onPlayerReady(e){
      document.getElementById('statusLine').textContent = 'ready — press play';
      e.target.setVolume(Number(document.getElementById('volBar').value));
    }

    function onPlayerError(e){
      document.getElementById('statusLine').textContent = "couldn't load that playlist — check it's public";
    }

    function onPlayerStateChange(e){
      var playIcon = document.getElementById('playIcon');
      var pauseIcon = document.getElementById('pauseIcon');
      var disc = document.getElementById('disc');

      if(e.data === YT.PlayerState.PLAYING){
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        disc.classList.add('spinning');
        document.getElementById('statusLine').textContent = 'now playing';
        startPolling();
        updateNowPlaying();
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        disc.classList.remove('spinning');
        stopPolling();
        if(e.data === YT.PlayerState.ENDED){
          document.getElementById('statusLine').textContent = 'up next…';
        } else if(e.data === YT.PlayerState.PAUSED){
          document.getElementById('statusLine').textContent = 'paused';
        } else if(e.data === YT.PlayerState.BUFFERING){
          document.getElementById('statusLine').textContent = 'buffering…';
          startPolling();
        }
      }
      if(e.data === YT.PlayerState.PLAYING){ updateNowPlaying(); }
    }

    function updateNowPlaying(){
      try{
        var data = player.getVideoData();
        if(!data) return;
        document.getElementById('trackTitle').textContent = data.title || 'untitled';
        document.getElementById('trackArtist').textContent = data.author || 'gwaramaari';
        var art = document.getElementById('coverArt');
        var newSrc = 'https://i.ytimg.com/vi/' + data.video_id + '/hqdefault.jpg';
        if(art.src !== newSrc){
          art.style.opacity = 1;
          art.src = newSrc;
        }
      } catch(err){}
    }

    function startPolling(){
      stopPolling();
      pollTimer = setInterval(function(){
        if(!player || !player.getCurrentTime) return;
        var cur = player.getCurrentTime() || 0;
        var dur = player.getDuration() || 0;
        document.getElementById('timeCurrent').textContent = fmtTime(cur);
        document.getElementById('timeDuration').textContent = fmtTime(dur);
        if(dur > 0){
          var pct = (cur / dur) * 100;
          document.getElementById('seekBar').value = pct;
          document.getElementById('discWrap').style.setProperty('--progress', pct.toFixed(2));
        }
      }, 500);
    }
    function stopPolling(){ if(pollTimer) clearInterval(pollTimer); }

    function fmtTime(sec){
      sec = Math.floor(sec || 0);
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // ---- controls ----
    document.getElementById('playBtn').addEventListener('click', function(){
      if(!player || !player.getPlayerState) return;
      var state = player.getPlayerState();
      if(state === YT.PlayerState.PLAYING){ player.pauseVideo(); }
      else { player.playVideo(); }
    });
    document.getElementById('nextBtn').addEventListener('click', function(){ player && player.nextVideo && player.nextVideo(); });
    document.getElementById('prevBtn').addEventListener('click', function(){ player && player.previousVideo && player.previousVideo(); });

    var seekBar = document.getElementById('seekBar');
    var seeking = false;
    seekBar.addEventListener('mousedown', function(){ seeking = true; });
    seekBar.addEventListener('touchstart', function(){ seeking = true; });
    seekBar.addEventListener('change', function(){
      if(player && player.getDuration){
        var dur = player.getDuration() || 0;
        player.seekTo((seekBar.value / 100) * dur, true);
      }
      seeking = false;
    });

    var volBar = document.getElementById('volBar');
    volBar.addEventListener('input', function(){
      if(player && player.setVolume) player.setVolume(Number(volBar.value));
    });

    var loopBtn = document.getElementById('loopBtn');
    var looping = false;
    loopBtn.addEventListener('click', function(){
      looping = !looping;
      loopBtn.classList.toggle('active', looping);
      if(player && player.setLoop) player.setLoop(looping);
    });

    // load the IFrame API script
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  </script>
</body>
</html>
