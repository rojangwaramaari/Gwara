<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nostalgia — Music-Gwaramaari</title>
  <meta name="description" content="A cinematic nostalgia music player powered by YouTube.">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main>
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-gradient" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <div id="clock">Loading...</div>

      <div class="listeners">
        <span>NOW LISTENING</span>
        <b>•</b>
        <strong>12 listeners</strong>
      </div>

      <nav>
        <a href="https://www.youtube.com/" target="_blank" rel="noreferrer">YT</a>
        <a href="https://www.instagram.com/" target="_blank" rel="noreferrer">IG</a>
      </nav>
    </header>

    <section class="player-wrap">
      <div id="playlist-tabs" class="playlist-tabs"></div>
      <div id="player"></div>
      <div class="rights-note">YOUTUBE PLAYER • RIGHTS-HOLDER UPLOADS ONLY</div>
    </section>
  </main>

  <script src="script.js?v=4"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
