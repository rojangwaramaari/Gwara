<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gwaramaari— Chill Nepali Vibes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Background Layers -->
    <div class="hero-bg"></div>
    <div class="hero-gradient"></div>
    <div class="grain"></div>

    <!-- Top Bar -->
    <header class="topbar">
      <div class="left-bar">
        <span id="clock">12:00 PM</span>
        <nav class="socials">
          <a href="https://youtube.com" target="_blank" rel="noopener">YT</a>
          <a href="https://instagram.com" target="_blank" rel="noopener">IG</a>
        </nav>
      </div>

      <div class="listeners">
        <span>NOW LISTENING</span> <b>•</b> <strong>12 listeners</strong>
      </div>
    </header>

    <!-- Floating Audio Player -->
    <div class="player-wrap">
      <!-- Playlist Tabs -->
      <div class="playlist-tabs" id="playlist-tabs"></div>

      <!-- Main Player Shell -->
      <div class="player" id="player"></div>

      <!-- Footer Rights Note -->
      <div class="rights-note">
        AMBIENT RADIO • CHILL NEPALI AUDIO EXPERIENCES
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
